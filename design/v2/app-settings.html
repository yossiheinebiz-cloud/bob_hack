<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הגדרות · איפה הכסף</title>
<link rel="stylesheet" href="assets/ds.css">
<style>
  .topbar .search svg, .topbar .btn svg { width: 18px; height: 18px; flex: none; }
  .topbar .search > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 700px) { .topbar .search .kbd { display: none; } }
  .btn svg { width: 17px; height: 17px; flex: none; }
  .st { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
  .st-tabs { position: sticky; top: 88px; display: grid; gap: 2px; }
  .st-tab { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); font-weight: 500; text-align: start; cursor: pointer; }
  .st-tab svg { width: 18px; height: 18px; opacity: .8; }
  .st-tab:hover { background: var(--surface); color: var(--ink); }
  .st-tab[aria-selected="true"] { background: var(--surface-3); color: var(--ink); box-shadow: inset -3px 0 0 var(--brand); }
  .panel { display: none; gap: 20px; }
  .panel.on { display: grid; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sec-head p { margin: 4px 0 0; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .74rem; font-weight: 700; background: var(--surface-3); color: var(--ink-2); flex: none; }
  .role { font-weight: 600; font-size: .78rem; padding: 2px 9px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); }
  .role.Admin { color: var(--brand); } .role.Finance { color: var(--amber); } .role.DevOps { color: var(--blue); } .role.DPO { color: var(--violet); }
  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: start; }
  .yes, .no { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; }
  .yes { background: var(--brand-glow); color: var(--brand); } .no { color: var(--faint); }
  .yes svg, .no svg { width: 15px; height: 15px; }
  .rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); align-items: center; }
  .rule:last-child { border-bottom: 0; }
  .rule .rid { font-family: var(--mono); font-size: .72rem; color: var(--muted); direction: ltr; }
  .rule .params { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .param { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--ink-2); }
  .param .input { width: 110px; height: 40px; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
  .rule[data-off="true"] > :not(.tg) { opacity: .45; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .alloc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .alloc div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: .8rem; display: grid; gap: 2px; }
  .alloc div.now { border-color: var(--brand-2); }
  .chk { width: 22px; height: 22px; accent-color: var(--brand-2); cursor: pointer; }
  .chan { display: flex; align-items: center; gap: 12px; }
  .chan .lg { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-3); font-weight: 800; font-size: .8rem; flex: none; }
  .kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px 20px; align-items: center; }
  .checklist { display: grid; gap: 2px; }
  .checklist .it { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .checklist .it:last-child { border-bottom: 0; }
  .meter { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--brand-2); }
  .meter i.hi { background: var(--amber); }
  .src-chip { font-family: var(--mono); font-size: .74rem; direction: ltr; }
  .danger { border-color: rgba(255,122,107,.35); }
  .btn.risk { color: var(--coral); border-color: rgba(255,122,107,.4); background: var(--coral-bg); }
  .plan-price { font-size: 2.4rem; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
  @media (max-width: 1000px) { .st { grid-template-columns: 1fr; } .st-tabs { position: static; display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; } .st-tab { flex: none; } .st-tab[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--brand); } }
  @media (max-width: 700px) { .kv { grid-template-columns: 1fr; gap: 6px; } .kv > .label { margin-top: 8px; } .alloc { grid-template-columns: 1fr; } .hide-sm { display: none; } .rule { padding: 14px; } }
</style>
</head>
<body data-page="settings">
<main data-shell>
  <div class="page-head">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">הגדרות סביבת העבודה</span>
      <h1 class="h1">הגדרות</h1>
      <span class="muted small" id="wsLine"></span>
    </div>
  </div>
  <div class="st">
    <nav class="st-tabs" role="tablist" aria-label="קטגוריות הגדרות" id="tabs"></nav>
    <div>
      <section class="panel" id="p-users" role="tabpanel"></section>
      <section class="panel" id="p-rules" role="tabpanel"></section>
      <section class="panel" id="p-alerts" role="tabpanel"></section>
      <section class="panel" id="p-privacy" role="tabpanel"></section>
      <section class="panel" id="p-audit" role="tabpanel"></section>
      <section class="panel" id="p-billing" role="tabpanel"></section>
    </div>
  </div>
</main>
<script src="assets/demo-data.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  const D = window.DEMO, K = D.kpi;
  const P = {
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
    check: '<path d="M5 12l5 5L20 7"/>',
    minus: '<path d="M6 12h12"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  const ic = (k) => P[k] ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>` : window.icon(k);
  const tg = (on, label) => `<button class="toggle" role="switch" aria-checked="${on}" aria-label="${label}"></button>`;
  const yes = `<span class="yes" aria-label="מותר">${ic('check')}</span>`, no = `<span class="no" aria-label="לא מותר">${ic('minus')}</span>`;
  document.getElementById('wsLine').textContent = `${D.company.name} · ${D.company.domain} · ${D.company.employees} עובדים`;

  const TABS = [['users', 'משתמשים ותפקידים', 'users'], ['rules', 'כללים וספים', 'sliders'], ['alerts', 'התראות', 'bell'], ['privacy', 'פרטיות ואבטחה', 'shield'], ['audit', 'יומן ביקורת', 'list'], ['billing', 'חיוב', 'card']];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(([k, l, i]) => `<button class="st-tab" role="tab" id="t-${k}" aria-controls="p-${k}" data-k="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  const show = (k) => { TABS.forEach(([x]) => { document.getElementById('t-' + x).setAttribute('aria-selected', x === k); document.getElementById('p-' + x).classList.toggle('on', x === k); }); if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k); };
  tabs.addEventListener('click', e => { const b = e.target.closest('.st-tab'); if (b) show(b.dataset.k); });
  document.addEventListener('click', e => { const t = e.target.closest('.toggle'); if (!t) return; const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); const r = t.closest('.rule'); if (r) r.dataset.off = !on; });

  // ---------- users ----------
  const USERS = [
    ['מל', D.user.name, D.user.email, 'CFO', 'Admin', 'היום 09:12', true],
    ['יע', 'יעל', 'yael@technosis.io', 'Finance', 'Finance', 'היום 08:40', true],
    ['רו', 'רון', 'ron@technosis.io', 'DevOps', 'DevOps', 'אתמול', true],
    ['שי', 'שי', 'shai@technosis.io', 'CTO', 'Admin', 'לפני 3 ימים', true],
    ['או', 'אורי', 'ori@technosis.io', 'Data', 'DevOps', 'אתמול', true],
    ['נו', 'נועה', 'noa@technosis.io', 'Operations', 'Finance', 'היום 07:55', true],
    ['לי', 'ליאת', 'dpo@technosis.io', 'ממונת הגנת פרטיות', 'DPO', 'לפני שבוע', false],
    ['דנ', 'דנה', 'dana@technosis.io', 'Sales Ops', 'Viewer', 'לפני שבועיים', true],
  ];
  const CAPS = [
    ['צפייה בממצאים ובהוצאות', [1, 1, 1, 1, 1]],
    ['צפייה בנתוני שכר (ברמת EMP)', [0, 1, 0, 0, 1]],
    ['שינוי סטטוס ממצא', [1, 1, 1, 0, 0]],
    ['אישור פעולות כתיבה של הסוכן', [1, 1, 1, 0, 0]],
    ['ניהול חיבורים ומקורות', [1, 0, 1, 0, 0]],
    ['יצירת טוקני MCP', [1, 0, 1, 0, 0]],
    ['עריכת כללים וספים', [1, 1, 0, 0, 0]],
    ['ייצוא ומחיקת נתונים', [1, 0, 0, 0, 1]],
    ['צפייה ביומן ביקורת', [1, 0, 0, 0, 1]],

  document.getElementById('p-users').innerHTML = `
    <div class="sec-head"><div><div class="h2">משתמשים</div><p class="small muted">${USERS.length} משתמשים פעילים, הזמנה אחת ממתינה. משתמשים חדשים נוצרים אוטומטית מ-Google Workspace (SSO).</p></div>
      <div class="row"><button class="btn">${ic('plus')}הזמנת משתמש</button></div></div>

        <tr><td><div class="who"><span class="av" style="border:1px dashed var(--line-2);background:none">?</span><div><div style="font-weight:600">board@technosis.io</div><div class="xs muted">הוזמן ע״י ${D.user.name} · לפני יומיים</div></div></div></td><td class="hide-sm ink2">דירקטוריון</td><td><span class="role Viewer">Viewer</span></td><td class="hide-sm"><span class="chip progress">ממתינה להזמנה</span></td><td class="hide-sm"><button class="btn sm ghost">שליחה מחדש</button></td></tr>
      </tbody></table></div>
    <div class="sec-head" style="margin-top:8px"><div><div class="h2">מטריצת הרשאות</div><p class="small muted">נתוני שכר גלויים רק ל-Finance ול-DPO, וגם להם רק ברמת מזהה עובד. Admin לא רואה שכר כברירת מחדל.</p></div></div>
    <div class="table-wrap"><table class="table matrix">
      <thead><tr><th>יכולת</th>${ROLES.map(r => `<th><span class="role ${r}">${r}</span></th>`).join('')}</tr></thead>
      <tbody>${CAPS.map(([c, v]) => `<tr><td>${c}</td>${v.map(x => `<td>${x ? yes : no}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;

  // ---------- rules ----------
  const RULE_LABEL = {
    AI_MODEL_OVERKILL: 'משימה פשוטה על מודל יקר', CLOUD_NO_COMMITMENT: 'מחשוב ענן בלי התחייבות', CLOUD_ZOMBIE: 'משאב ענן בלי תעבורה',

    AI_NO_PROMPT_CACHE: 'פרומפט חוזר בלי caching', LICENSE_DUPLICATE_FUNC: 'שני כלים לאותה פונקציה', AUTO_RENEWAL_JUMP: 'קפיצת מחיר בחידוש אוטומטי',
    CLOUD_EGRESS_SPIKE: 'קפיצה בתעבורה יוצאת', LICENSE_UNUSED: 'מושב בתשלום בלי שימוש', DUP_CROSS_CURRENCY: 'תשלום כפול בשני מטבעות',
    CLOUD_ORPHAN_STORAGE: 'אחסון יתום (דיסקים, snapshots)', PAYROLL_POST_TERMINATION: 'שכר אחרי תאריך סיום', LICENSE_DEPARTED: 'מושב של עובד שעזב',

    DUP_CARD_AND_AP: 'חיוב בכרטיס וגם בחשבונית', CAR_LEASE_DEPARTED: 'ליסינג אחרי החזרת רכב', PHONE_LINE_DEPARTED: 'קו סלולרי של עובד שעזב',

  const PARAMS = {

    LICENSE_DEPARTED: num(7, 'ימים', 'מושב פעיל אחרי סיום'),
    PHONE_LINE_DEPARTED: num(60, 'ימים', 'קו בלי שימוש מעל'),
    AUTO_RENEWAL_JUMP: num(10, '%', 'עלייה בחידוש מעל') + num(45, 'ימים', 'התראה לפני חידוש'),
    DUP_INVOICE_EXACT: num(14, 'ימים', 'חלון כפילות'),
    DUP_CARD_AND_AP: num(14, 'ימים', 'חלון כפילות'),
    DUP_CROSS_CURRENCY: num(14, 'ימים', 'חלון כפילות') + num(3, '%', 'סטיית שער מותרת'),
    INVOICE_SPLITTING: num('20,000', '₪', 'סף אישור סמנכ״ל') + num(30, 'ימים', 'חלון צבירה'),
    CLOUD_ZOMBIE: num(30, 'ימים', 'בלי תעבורה מעל'),
    CLOUD_DEV_ALWAYS_ON: num(3, '%', 'CPU מתחת ל-') + `<label class="param">שעות שקטות<input class="input" value="21:00–07:00" aria-label="שעות שקטות" style="width:130px"></label>`,
    CLOUD_ORPHAN_STORAGE: num(60, 'ימים', 'לא מחובר מעל'),
    AI_MODEL_OVERKILL: num(400, 'טוקן', 'פלט ממוצע מתחת ל-') + num('100,000', 'קריאות', 'בחודש מעל'),
    UTILITY_SPIKE: num(25, '%', 'קפיצה שנתית מעל'),
    FX_CARD_FEES: num('5,000', '$', 'חיוב חודשי לספק מעל'),
    INVOICE_NO_ALLOCATION: `<div class="alloc">${[['01/01/2025', 20000], ['01/01/2026', 10000], ['01/06/2026', 5000]].map(([d, v], i, a) => `<div class="${i === a.length - 1 ? 'now' : ''}"><span class="muted xs">מ-${d}${i === a.length - 1 ? ' · בתוקף' : ''}</span><span>חשבונית מעל <b class="money">${ils(v)}</b> לפני מע״מ</span></div>`).join('')}</div>`,

  const rulesByCat = {};
  D.findings.forEach(f => { (rulesByCat[f.cat] = rulesByCat[f.cat] || new Map()).set(f.rule, ((rulesByCat[f.cat].get(f.rule)) || 0) + 1); });

  document.getElementById('p-rules').innerHTML = `

    </div>`).join('')}`;

  // ---------- alerts ----------
  const EVENTS = [
    ['ממצא חדש מעל ₪20,000', [1, 1, 1]], ['חידוש אוטומטי בעוד 45 יום', [1, 1, 0]], ['קפיצת מחיר בחידוש', [1, 0, 1]],
    ['חיוב כפול שזוהה', [1, 0, 1]], ['ממצא שכר (רק Finance ו-DPO)', [0, 1, 0]], ['פעולת סוכן ממתינה לאישור', [1, 0, 0]],
    ['חיבור נכשל (למשל הרשאה שפגה)', [1, 1, 0]], ['סיכום חיסכון שבועי', [0, 1, 0]],
  ];
  document.getElementById('p-alerts').innerHTML = `
    <div class="sec-head"><div><div class="h2">התראות</div><p class="small muted">לאן כל אירוע נשלח. ממצאי שכר לעולם לא נשלחים לערוץ משותף.</p></div></div>
    <div class="grid g3">
