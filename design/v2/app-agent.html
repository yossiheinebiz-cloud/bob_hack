<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הסוכן · איפה הכסף</title>
<link rel="stylesheet" href="assets/ds.css">
<style>
  body[data-page="agent"] .content { padding: 0; gap: 0; }
  .topbar .search svg, .topbar .btn svg { width: 18px; height: 18px; flex: none; }
  .topbar .search > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 700px) { .topbar .search .kbd { display: none; } }
  .ag svg:not([width]) { width: 18px; height: 18px; flex: none; }
  .perm svg { color: var(--muted); }
  .ag { display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; height: calc(100vh - 64px); min-height: 560px; }
  .ag > * { min-height: 0; }
  .ag-hist { border-inline-end: 1px solid var(--line); background: var(--bg-2); overflow: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .ag-hist .grp { font-size: .7rem; font-weight: 700; letter-spacing: .08em; color: var(--faint); padding: 14px 10px 6px; }
  .hist-item { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; color: var(--ink-2); font-size: .88rem; min-height: 44px; }
  .hist-item:hover { background: var(--surface); color: var(--ink); }
  .hist-item[aria-current="true"] { background: var(--surface-3); color: var(--ink); box-shadow: inset -3px 0 0 var(--violet); }
  .hist-item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .hist-item .m { font-size: .74rem; color: var(--muted); }

  .ag-chat { display: flex; flex-direction: column; background: var(--bg); }
  .ag-head { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .powered { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(167,139,250,.35); background: var(--violet-bg); color: var(--violet); font-size: .76rem; font-weight: 700; }
  .powered svg { width: 14px; height: 14px; }
  .ag-log { flex: 1; overflow: auto; padding: 28px; scroll-behavior: smooth; }
  .ag-log-inner { max-width: 820px; margin-inline: auto; display: grid; gap: 26px; }

  .msg-user { justify-self: end; max-width: 72%; background: var(--surface-3); border: 1px solid var(--line-2); padding: 12px 16px; border-radius: 18px 18px 18px 6px; font-weight: 500; }
  .msg-user .who { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
  .msg-agent { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
  .bot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(167,139,250,.28), rgba(91,157,255,.18)); border: 1px solid rgba(167,139,250,.35); color: var(--violet); }
  .bot svg { width: 18px; height: 18px; }
  .msg-body { display: grid; gap: 14px; min-width: 0; }
  .msg-body p { margin: 0; color: var(--ink-2); }
  .msg-body p strong { color: var(--ink); }

  details.trace { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); font-size: .82rem; }
  details.trace summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 40px; color: var(--muted); }
  details.trace summary::-webkit-details-marker { display: none; }
  details.trace summary svg { width: 15px; height: 15px; }
  details.trace summary .chev { margin-inline-start: auto; transition: transform .2s; }
  details.trace[open] summary .chev { transform: rotate(-90deg); }
  .calls { border-top: 1px solid var(--line); display: grid; }
  .call { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 9px 12px; border-bottom: 1px dashed var(--line); }
  .call:last-child { border-bottom: 0; }
  .call .fn { font-family: var(--mono); color: var(--violet); font-size: .8rem; direction: ltr; text-align: right; }
  .call .args { font-family: var(--mono); color: var(--ink-2); font-size: .74rem; direction: ltr; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .call .meta { font-family: var(--mono); color: var(--muted); font-size: .74rem; direction: ltr; white-space: nowrap; }

  .cites { display: flex; flex-wrap: wrap; gap: 6px; }
  .cite { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 8px; font-size: .76rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink-2); transition: border-color .15s, color .15s; }
  .cite:hover { border-color: var(--violet); color: var(--ink); }
  .cite.fid { font-family: var(--mono); color: var(--amber); direction: ltr; white-space: nowrap; }
  .cite svg { width: 13px; height: 13px; opacity: .8; }
  .inline-cite { font-family: var(--mono); font-size: .74rem; color: var(--amber); border-bottom: 1px dotted currentColor; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }

  .ans-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .ans-card .table th { background: var(--surface); }
  .ans-card .table td { padding: 10px 12px; }
  .ans-card tfoot td { font-weight: 800; border-bottom: 0; background: var(--surface-2); }
  .ans-card .money.save { color: var(--brand); font-weight: 700; }

  .chart-card { padding: 16px; display: grid; gap: 14px; }
  .proj { display: grid; grid-template-columns: 150px minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-size: .84rem; }
  .proj .bar { height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
  .proj .bar i { display: block; height: 100%; border-radius: 5px; background: var(--violet); }
  .proj .bar i.warn { background: var(--amber); }
  .proj .name { font-family: var(--mono); font-size: .78rem; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .why-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .why-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .88rem; color: var(--ink-2); }
  .why-list .n { width: 22px; height: 22px; border-radius: 6px; background: var(--violet-bg); color: var(--violet); font-weight: 800; font-size: .75rem; display: grid; place-items: center; }

  .email { border: 1px solid rgba(91,157,255,.35); border-radius: 16px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); overflow: hidden; }
  .email-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--blue-bg); color: var(--blue); font-size: .82rem; font-weight: 700; flex-wrap: wrap; }
  .email-head svg { width: 16px; height: 16px; }
  .email-meta { display: grid; grid-template-columns: 56px 1fr; gap: 6px 12px; padding: 14px 18px 0; font-size: .86rem; }
  .email-meta dt { color: var(--muted); } .email-meta dd { margin: 0; }
  .email-body { padding: 14px 18px; white-space: pre-line; color: var(--ink-2); font-size: .92rem; line-height: 1.7; border-top: 1px solid var(--line); margin-top: 12px; }
  .email-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; background: var(--bg-2); }
  .email-foot .btn { min-height: 44px; }
  .confirm { display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--blue-bg); font-size: .88rem; }
  .email[data-state="confirm"] .confirm { display: flex; }
  .email[data-state="confirm"] .email-foot, .email[data-state="sent"] .email-foot { display: none; }
  .sent { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--brand-glow); color: var(--brand); font-weight: 600; font-size: .88rem; }
  .email[data-state="sent"] .sent { display: flex; }
  .sent svg { width: 18px; height: 18px; }

  .caret::after { content: ""; display: inline-block; width: 8px; height: 1.05em; margin-inline-start: 2px; vertical-align: -2px; background: var(--violet); animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { opacity: 0; } }
  .pending { opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease; }
  .pending.in { opacity: 1; transform: none; }

  .ag-compose { padding: 12px 28px 20px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .ag-compose-inner { max-width: 820px; margin-inline: auto; display: grid; gap: 10px; }
  .sugg { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .sugg button { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: .82rem; cursor: pointer; }
  .sugg button:hover { border-color: var(--violet); color: var(--ink); }
  .composer { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 8px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--surface); }
  .composer:focus-within { border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-bg); }
  .composer textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; min-height: 44px; max-height: 140px; padding: 11px 8px; line-height: 1.5; }
  .composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-3); color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.send { background: var(--violet); color: #160B33; }
  .icon-btn.send:hover { background: #BBA5FF; }
  .icon-btn.send svg { transform: scaleX(-1); }
  .mention { position: absolute; bottom: calc(100% + 8px); inset-inline-start: 0; width: min(420px, 100%); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; z-index: 5; }
  .mention.show { display: grid; }
  .mention button { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; text-align: start; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: .84rem; }
  .mention button:hover, .mention button:focus-visible { background: var(--surface-3); }
  .mention .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .guard { font-size: .74rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .guard svg { width: 13px; height: 13px; }

  .ag-ctx { border-inline-start: 1px solid var(--line); background: var(--bg-2); overflow: auto; padding: 18px; display: grid; gap: 16px; align-content: start; }
  .ctx-sec { display: grid; gap: 10px; }
  .ctx-sec h3 { font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--faint); margin: 0; }
  .src { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; font-size: .82rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .src:last-child { border-bottom: 0; }
  .src svg { width: 16px; height: 16px; color: var(--muted); }
  .src .f { font-family: var(--mono); font-size: .76rem; direction: ltr; text-align: right; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .perm { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--ink-2); }
  .perm .mono { color: var(--violet); }

  @media (max-width: 1280px) { .ag { grid-template-columns: 230px minmax(0, 1fr); } .ag-ctx { display: none; } }
  @media (max-width: 900px) {
    .ag { grid-template-columns: 1fr; height: auto; min-height: 0; }
    .ag-hist { display: none; }
    .ag-log { overflow: visible; padding: 18px 16px; }
    .ag-head { padding: 12px 16px; }
    .ag-head .grow { flex-basis: 100%; }
    #shareBtn { display: none; }
    .ag-compose { position: sticky; bottom: 0; padding: 10px 12px 14px; }
    .msg-user { max-width: 88%; }
    .msg-agent { grid-template-columns: 1fr; gap: 8px; }
    .proj { grid-template-columns: 110px minmax(0, 1fr) 80px; }
    .call { grid-template-columns: minmax(0, 1fr) auto auto; }
    .call .args { display: none; }
    .ans-card .hide-sm { display: none; }
  }
</style>
</head>
<body data-page="agent">
<main data-shell>
  <div class="ag">
    <aside class="ag-hist" aria-label="היסטוריית שיחות">
      <button class="btn block" id="newChat" style="min-height:44px"><span data-ic="plus"></span>שיחה חדשה</button>
      <div id="hist"></div>
    </aside>

    <section class="ag-chat" aria-label="שיחה עם הסוכן">
      <header class="ag-head">
        <div class="grow">
          <div class="h2">על מה אנחנו משלמים ולא משתמשים?</div>
          <div class="xs muted">התחילה היום 09:12 · 3 שאלות · <span id="headCount"></span></div>
        </div>
        <span class="powered"><span data-ic="ai"></span>watsonx Orchestrate · MCP</span>
        <button class="btn sm" id="shareBtn"><span data-ic="doc"></span>ייצוא לדוח</button>
      </header>
      <div class="ag-log" id="log"><div class="ag-log-inner" id="logInner"></div></div>
      <div class="ag-compose">
        <div class="ag-compose-inner">
          <div class="sugg" id="sugg" aria-label="שאלות מוצעות"></div>
          <form class="composer" id="composer">
            <div class="mention" id="mention" role="listbox" aria-label="צירוף ממצא"></div>
            <button type="button" class="icon-btn" aria-label="צירוף קובץ"><span data-ic="clip"></span></button>
            <button type="button" class="icon-btn" id="atBtn" aria-label="צירוף ממצא (@finding)" aria-haspopup="listbox" aria-expanded="false"><span data-ic="at"></span></button>
            <textarea id="input" rows="1" placeholder="שאלו על ההוצאות, או הקלידו @ כדי לצרף ממצא…" aria-label="הודעה לסוכן"></textarea>
            <button type="submit" class="icon-btn send" aria-label="שליחה"><span data-ic="send"></span></button>
          </form>
          <div class="guard"><span data-ic="shield"></span>הסוכן עונה רק מהנתונים המחוברים ומצטט שורות מקור. כל פעולת כתיבה (מייל, ביטול, מחיקה) דורשת אישור שלך.</div>
        </div>
      </div>
    </section>

    <aside class="ag-ctx" id="ctx" aria-label="הקשר השיחה"></aside>
  </div>
</main>
<script src="assets/demo-data.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  const D = window.DEMO;
  const P = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    clip: '<path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>',
    at: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
    send: '<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    chev: '<path d="M15 6l-6 6 6 6"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    check: '<path d="M5 12l5 5L20 7"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  };
  const ic = (k) => P[k] ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>` : window.icon(k);
  const fillIcons = (root) => root.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
  const F = (id) => D.findings.find(f => f.id === id);
  const money = (n, cls = '') => `<span class="money ${cls}">${ils(n)}</span>`;
  const conf = (c) => `<span class="conf" aria-label="ביטחון ${Math.round(c * 100)}%">${[1,2,3,4,5].map(i => `<i class="${c >= i / 5 - .05 ? 'on' : ''}"></i>`).join('')}</span>`;
  const fid = (id) => `<a class="cite fid" href="app-finding.html?id=${id}">[${id}]</a>`;
  const src = (id, label) => `<a class="cite" href="app-finding.html?id=${id}">${ic('db')}${label}</a>`;
  const inl = (id) => `<a class="inline-cite" href="app-finding.html?id=${id}">${id}</a>`;
  const trace = (calls, open) => {
    const ms = calls.reduce((s, c) => s + c[2], 0);
    return `<details class="trace" ${open ? 'open' : ''}><summary>${ic('tool')}<span>${calls.length} קריאות כלים · <span class="num">${ms}ms</span> · שרת MCP של איפה הכסף</span>${ic('chev').replace('<svg', '<svg class="chev"')}</summary>
      <div class="calls">${calls.map(([fn, args, t, rows]) => `<div class="call"><span class="fn">${fn}</span><span class="args" title='${args}'>${args}</span><span class="meta">${t}ms</span><span class="meta">${rows} rows</span></div>`).join('')}</div></details>`;
  };

  // ---------- history ----------
  const HIST = [
    ['היום', [['על מה אנחנו משלמים ולא משתמשים?', '3 שאלות · טיוטת מייל ממתינה', true], ['מה מתחדש עד סוף נובמבר?', '09:02']]],
    ['השבוע', [['למה AWS עלה באוגוסט?', 'רון (DevOps) שותף'], ['חשבוניות כפולות ברבעון 3', 'יעל (Finance)'], ['הכנה לישיבת דירקטוריון', 'יצא לדוח']]],
    ['אוקטובר', [['Cursor מול Copilot: מי משתמש במה', '31 מפתחים'], ['מספרי הקצאה חסרים', 'אושר ונשלח לספקים'], ['offboarding של עוזבים', '7 עובדים']]],
  ];
  document.getElementById('hist').innerHTML = HIST.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([t, m, cur]) =>
    `<a class="hist-item" href="#" ${cur ? 'aria-current="true"' : ''}><span class="t">${t}</span><span class="m">${m}</span></a>`).join('')).join('');

  // ---------- message 1: paying for unused ----------
  const UNUSED = ['F-1003', 'F-1005', 'F-1011', 'F-1015', 'F-1018', 'F-1024'].map(F).sort((a, b) => b.amount - a.amount);
  const unusedTotal = UNUSED.reduce((s, f) => s + f.amount, 0);
  const m1 = `
    <div class="msg-user"><div class="who">${D.user.name} · 09:12</div>על מה אנחנו משלמים ולא משתמשים?</div>
    <div class="msg-agent"><div class="bot">${ic('ai')}</div><div class="msg-body">
      ${trace([
        ['list_findings', '{"rules":["LICENSE_UNUSED","LICENSE_DEPARTED","AI_SEAT_OVERLAP","CLOUD_ZOMBIE","AI_KEY_ORPHAN","PHONE_LINE_DEPARTED"],"status":"open"}', 41, UNUSED.length],
        ['query_spend', '{"source":"saas_seats.csv","filter":"last_active_days > 90","group_by":"vendor"}', 118, 13],
        ['query_spend', '{"source":"hibob_employees.csv","join":"seats,phone_lines,api_keys","filter":"terminated = true"}', 96, 23],
        ['query_spend', '{"source":"aws_cur_2026-10.parquet","filter":"cluster = staging-old","metric":"alb_requests"}', 204, 312],
      ], true)}
      <p>מצאתי <strong>${UNUSED.length} ממצאים פתוחים</strong> של תשלום על משהו שאף אחד לא משתמש בו. יחד זה <strong>${money(unusedTotal, 'accent-text')} לשנה</strong>, חיסכון חוזר. הסכומים מחושבים לפי מחירון החוזה הנוכחי, לא לפי הערכה.</p>
      <div class="ans-card table-wrap" style="border:0">
        <table class="table">
          <thead><tr><th>ממצא</th><th>ספק</th><th class="hide-sm">מה לא בשימוש</th><th class="end">₪ לשנה</th><th class="hide-sm">ביטחון</th></tr></thead>
          <tbody>${UNUSED.map(f => `<tr><td>${fid(f.id)}</td><td style="font-weight:600">${f.vendor}</td><td class="hide-sm small ink2">${f.title}</td><td class="end">${money(f.amount, 'save')}</td><td class="hide-sm">${conf(f.conf)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td colspan="2">סה״כ</td><td class="hide-sm"></td><td class="end">${money(unusedTotal, 'save')}</td><td class="hide-sm"></td></tr></tfoot>
        </table>
      </div>
      <p>הכי מהיר לסגור: ${inl('F-1003')} (אשכול staging-old, אפס בקשות מאז 15/09/2026) ו-${inl('F-1005')} (מפתח API של עובד שעזב). שניהם דורשים רק בדיקת תלות לפני מחיקה. לא כללתי את ${inl('F-1013')} כי כבר טופל ונמדד.</p>
      <div class="cites">${src('F-1011', 'saas_seats.csv · 13 שורות')}${src('F-1015', 'hibob_employees.csv · 7 שורות')}${src('F-1018', 'copilot_seats.csv · 31 שורות')}${src('F-1003', 'aws_cur_2026-10.parquet · 312 שורות')}${src('F-1024', 'partner_lines_10-2026.pdf · 9 שורות')}</div>
    </div></div>`;

  // ---------- message 2: AI quarter ----------
  const A = D.spend.monthlyAi;                // idx 0 = 11/2024 … 23 = 10/2026
  const q3 = A.slice(20, 23).reduce((s, n) => s + n, 0);      // 07–09/2026
  const q2 = A.slice(17, 20).reduce((s, n) => s + n, 0);      // 04–06/2026
  const q3ly = A.slice(8, 11).reduce((s, n) => s + n, 0);     // 07–09/2025
  const pct = (a, b) => Math.round((a / b - 1) * 1000) / 10;
  const MONTHS = A.map((_, i) => { const m = (10 + i) % 12 + 1, y = 2024 + Math.floor((10 + i) / 12); return String(m).padStart(2, '0') + '/' + String(y).slice(2); });
  const chart = (() => {
    const W = 640, H = 170, pad = 22, bw = (W - pad * 2) / A.length, max = Math.max(...A) * 1.15;
    const bars = A.map((v, i) => {
      const h = (v / max) * (H - 40), x = pad + i * bw + 3, y = H - 22 - h, q = i >= 20 && i <= 22;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${q ? 'var(--violet)' : 'var(--line-2)'}"/>` +
        (q ? `<text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${Math.round(v / 1000)}K</text>` : '');
    }).join('');
    const lbl = (i) => `<text x="${(pad + (i + .5) * bw).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${MONTHS[i]}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr" aria-label="הוצאה חודשית על AI, ${MONTHS[0]} עד ${MONTHS[23]}">
      <line x1="${pad}" x2="${W - pad}" y1="${H - 22}" y2="${H - 22}" stroke="var(--line)"/>${bars}${[0, 12, 20, 23].map(lbl).join('')}</svg>`;
  })();
  const PROJ = D.ai.projects.map(p => ({ ...p, ils: p.usd * D.company.usdIls })).sort((a, b) => b.ils - a.ils);
  const pmax = PROJ[0].ils;
  const aiFix = ['F-1001', 'F-1007', 'F-1005'].map(F);
  const aiFixTotal = aiFix.reduce((s, f) => s + f.amount, 0);
  const m2 = `
    <div class="msg-user"><div class="who">${D.user.name} · 09:15</div>כמה עלה לנו AI ברבעון ולמה זה עולה?</div>
    <div class="msg-agent"><div class="bot">${ic('ai')}</div><div class="msg-body">
      ${trace([
        ['query_spend', '{"category":"ai","period":"2026-Q3","group_by":"month"}', 64, 3],
        ['query_spend', '{"category":"ai","period":"2026-10","group_by":"project","sources":["openai_usage","anthropic_admin"]}', 51, PROJ.length],
        ['list_findings', '{"category":"ai","status":"open","sort":"amount_desc"}', 22, D.findings.filter(f => f.cat === 'ai' && f.status === 'open').length],
      ])}
      <p>ברבעון השלישי (07–09/2026) AI עלה <strong>${money(q3)}</strong>. זה <strong class="num">+${pct(q3, q2)}%</strong> מול הרבעון הקודם ו-<strong class="num">+${pct(q3, q3ly)}%</strong> מול אותו רבעון אשתקד. בקצב של אוקטובר זה ${money(A[23] * 12)} בשנה.</p>
      <div class="ans-card chart-card">
        <div class="row between wrap"><span class="h3">הוצאה חודשית על AI, ₪</span><span class="chip ai"><span class="dot"></span>רבעון 3 מודגש</span></div>
        ${chart}
        <div class="row between wrap"><span class="h3">לפי פרויקט, אוקטובר 2026</span><span class="xs muted">₪ לחודש · % cached tokens</span></div>
        <div class="stack" style="gap:8px">${PROJ.map(p => `<div class="proj"><span class="name" title="${p.name}">${p.name}</span><span class="bar"><i class="${p.team.includes('עזב') ? 'warn' : ''}" style="width:${(p.ils / pmax * 100).toFixed(1)}%"></i></span><span class="money small" style="justify-self:end">${ils(p.ils)}</span></div>`).join('')}</div>
      </div>
      <p><strong>למה זה עולה:</strong> שלושה דברים מסבירים את רוב הצמיחה, ושלושתם ניתנים לתיקון בלי לוותר על יכולת:</p>
      <ul class="why-list">${aiFix.map((f, i) => `<li><span class="n">${i + 1}</span><span><strong style="color:var(--ink)">${f.title}.</strong> ${f.why}</span>${fid(f.id)}</li>`).join('')}</ul>
      <p>תיקון שלושתם חוסך כ-${money(aiFixTotal, 'accent-text')} בשנה. שאר הצמיחה היא שימוש אמיתי בפיצ׳רים חדשים, ואני לא ממליץ לגעת בה.</p>
      <div class="cites">${src('F-1001', 'anthropic_usage_2026-Q3.csv · 92 שורות')}${src('F-1007', 'openai_usage_2026-Q3.csv · 92 שורות')}${src('F-1005', 'openai_api_keys.json · 1 שורה')}</div>
    </div></div>`;

  // ---------- message 3: HubSpot email (streamed) ----------
  const hs = F('F-1009');
  const hv = D.vendors.find(v => v.name === 'HubSpot');
  const prior = Math.round(hv.amount / (1 + hv.trend) / 1000) * 1000;
  const streamText = `הכנתי טיוטה על בסיס ${hs.id} ושתי החשבוניות השנתיות. הטון ענייני, בלי האשמות: מבקשים להחזיר את המחיר הקודם לאותם 14 מושבים, ומציעים התחייבות לשנתיים אם צריך. שום דבר לא נשלח עד שתאשרי.`;
  const m3 = `
    <div class="msg-user"><div class="who">${D.user.name} · 09:18</div>תכין מייל ל-HubSpot לבקש את המחיר הקודם</div>
    <div class="msg-agent" id="m3"><div class="bot">${ic('ai')}</div><div class="msg-body">
      ${trace([
        ['get_finding', '{"id":"F-1009"}', 18, 1],
        ['query_spend', '{"vendor":"HubSpot","doc_type":"invoice","years":[2025,2026]}', 73, 2],
        ['draft_email', '{"finding_id":"F-1009","to_role":"account_manager","tone":"neutral","lang":"he"}', 640, 1],
      ])}
      <p id="streamP"></p>
      <div class="email pending" id="email" data-state="draft">
        <div class="email-head">${ic('mail')}טיוטת מייל<span class="chip progress" style="margin-inline-start:auto">${ic('lock')}פעולת כתיבה · דורשת אישור</span></div>
        <dl class="email-meta">
          <dt>אל</dt><dd>מנהל/ת הלקוח ב-HubSpot <span class="muted small">(מתוך החוזה)</span></dd>
          <dt>מאת</dt><dd><span class="mono">${D.user.email}</span></dd>
          <dt>נושא</dt><dd style="font-weight:600">חידוש ${D.company.name}: בקשה לשמירה על המחיר הקודם</dd>
        </dl>
        <div class="email-body">שלום,

החידוש השנתי שלנו התבצע אוטומטית ב-01/10/2026 במחיר של <span class="money">${ils(hv.amount)}</span> לשנה, לעומת <span class="money">${ils(prior)}</span> בשנה הקודמת. מדובר באותם 14 מושבים, בלי שינוי בתכולה, ולא קיבלנו הצעת מחיר מראש.

נשמח שתחזירו את המחיר לרמה של השנה הקודמת. אם זה מקל עליכם, אנחנו פתוחים לדבר על התחייבות לשנתיים.

אשמח לתשובה עד סוף השבוע הבא.

תודה,
${D.user.name}
${D.user.role}, ${D.company.name}</div>
        <div class="email-foot">
          <button class="btn primary" id="approve">${ic('check')}אשר ושלח</button>
          <button class="btn">ערוך</button>
          <button class="btn ghost">שמור כטיוטה ב-Gmail</button>
          <span class="xs muted" style="margin-inline-start:auto">פוטנציאל: ${money(hs.amount)} לשנה · ${fid(hs.id)}</span>
        </div>
        <div class="confirm" role="alertdialog" aria-label="אישור שליחה">
          <span>${ic('lock')}</span><span class="grow">לשלוח מ-<span class="mono">${D.user.email}</span>? הפעולה תירשם ביומן הביקורת.</span>
          <button class="btn primary" id="confirmSend">כן, שלח</button><button class="btn" id="cancelSend">חזרה</button>
        </div>
        <div class="sent" role="status">${ic('check')}נשלח 09:21 · נרשם ביומן הביקורת · ${hs.id} עבר ל"בטיפול"</div>
      </div>
    </div></div>`;

  const inner = document.getElementById('logInner');
  inner.innerHTML = m1 + m2 + m3;
  document.getElementById('headCount').innerHTML = `<span class="num">${D.kpi.rowsScanned.toLocaleString('en-US')}</span> שורות זמינות`;

  // streaming effect (reduced-motion safe), starts when the message scrolls into view
  const p = document.getElementById('streamP'), card = document.getElementById('email');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = false;
  const finish = () => { p.classList.remove('caret'); p.textContent = streamText; card.classList.add('in'); };
  const run = () => {
    if (started) return; started = true;
    if (reduce) return finish();
    let i = 0; p.classList.add('caret');
    const t = setInterval(() => { i += 3; p.textContent = streamText.slice(0, i); if (i >= streamText.length) { clearInterval(t); setTimeout(finish, 180); } }, 22);
  };
  if ('IntersectionObserver' in window) new IntersectionObserver((es, o) => { if (es.some(e => e.isIntersecting)) { o.disconnect(); run(); } }, { threshold: .2 }).observe(document.getElementById('m3'));
  else run();

  // approval flow
  document.getElementById('approve').onclick = () => { card.dataset.state = 'confirm'; document.getElementById('confirmSend').focus(); };
  document.getElementById('cancelSend').onclick = () => { card.dataset.state = 'draft'; document.getElementById('approve').focus(); };
  document.getElementById('confirmSend').onclick = () => { card.dataset.state = 'sent'; };

  // suggestions
  const SUG = ['מה מתחדש ב-30 הימים הקרובים?', 'אילו ממצאים פתוחים מעל ₪50,000?', 'השווה AWS ספטמבר מול אוקטובר', 'מי הבעלים של ממצאי הענן?', 'תכין סיכום לדירקטוריון'];
  const input = document.getElementById('input');
  document.getElementById('sugg').innerHTML = SUG.map(s => `<button type="button">${s}</button>`).join('');
  document.getElementById('sugg').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') { input.value = e.target.textContent; input.focus(); } });

  // @finding mention
  const menu = document.getElementById('mention'), atBtn = document.getElementById('atBtn');
  menu.innerHTML = D.findings.filter(f => f.status === 'open' && f.amount).sort((a, b) => b.amount - a.amount).slice(0, 6)
    .map(f => `<button type="button" role="option" data-id="${f.id}"><span class="mono" style="color:var(--amber)">${f.id}</span><span class="t">${f.title}</span><span class="money xs muted">${ilsK(f.amount)}</span></button>`).join('');
  const toggleMenu = (show) => { menu.classList.toggle('show', show); atBtn.setAttribute('aria-expanded', show); };
  atBtn.onclick = () => toggleMenu(!menu.classList.contains('show'));
  menu.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; input.value = (input.value.replace(/@$/, '') + ' @' + b.dataset.id + ' ').trimStart(); toggleMenu(false); input.focus(); });
  input.addEventListener('input', () => { toggleMenu(/(^|\s)@$/.test(input.value)); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });

  // ponytail: static mock — sending appends the question + a canned grounded-refusal reply
  document.getElementById('composer').addEventListener('submit', e => {
    e.preventDefault(); const q = input.value.trim(); if (!q) return;
    const d = document.createElement('div'); d.style.display = 'contents';
    d.innerHTML = `<div class="msg-user"><div class="who">${D.user.name} · עכשיו</div></div><div class="msg-agent"><div class="bot">${ic('ai')}</div><div class="msg-body"><p>זו הדגמה סטטית. בגרסה החיה התשובה מגיעה מ-watsonx Orchestrate דרך כלי ה-MCP, עם ציטוט ממצאים ושורות מקור.</p></div></div>`;
    d.querySelector('.msg-user').append(q);
    inner.appendChild(d); input.value = ''; toggleMenu(false);
    const log = document.getElementById('log'); log.scrollTop = log.scrollHeight;
  });

  // ---------- context panel ----------
  const used = [['hibob_employees.csv', 23], ['saas_seats.csv', 13], ['aws_cur_2026-10.parquet', 312], ['openai_usage_2026-Q3.csv', 92], ['anthropic_usage_2026-Q3.csv', 92], ['hubspot_invoices (Gmail)', 2]];
  document.getElementById('ctx').innerHTML = `
    <div class="ctx-sec">
      <h3>ממצא בשיחה</h3>
      <a class="card flat" href="app-finding.html?id=${hs.id}" style="padding:16px;display:grid;gap:10px">
        <div class="row between"><span class="mono" style="color:var(--amber)">${hs.id}</span><span class="chip open"><span class="dot"></span>פתוח</span></div>
        <div class="h3">${hs.title}</div>
        <div class="money" style="font-size:1.6rem;font-weight:900;color:var(--brand)">${ils(hs.amount)}</div>
        <div class="xs muted">לשנה · חיסכון חוזר</div>
        <div class="small ink2">${hs.why}</div>
        <hr class="divider" style="margin:4px 0">
        <div class="row between small"><span class="muted">ביטחון</span>${conf(hs.conf)}</div>
        <div class="row between small"><span class="muted">אחראית</span><span>${hs.owner}</span></div>
        <div class="small"><span class="muted">פעולה: </span>${hs.action}</div>
      </a>
    </div>
    <div class="ctx-sec">
      <h3>מקורות שהשיחה השתמשה בהם</h3>
      <div>${used.map(([f, n]) => `<div class="src">${ic('db')}<span class="f" title="${f}">${f}</span><span class="xs muted num">${n} שורות</span></div>`).join('')}</div>
    </div>
    <div class="ctx-sec">
      <h3>הרשאות הסוכן בשיחה הזו</h3>
      <div class="perm">${ic('eye')}<span>קריאה: <span class="mono">list_findings</span>, <span class="mono">query_spend</span>, <span class="mono">get_finding</span></span></div>
      <div class="perm">${ic('lock')}<span>כתיבה באישור: <span class="mono">draft_email</span>, <span class="mono">update_status</span></span></div>
      <div class="perm">${ic('shield')}<span>אין גישה לנתוני שכר ברמת עובד (תפקיד CFO, ממוסך)</span></div>
    </div>
    <div class="card flat small" style="padding:14px;display:grid;gap:6px;border-color:rgba(167,139,250,.3)">
      <span class="powered" style="justify-self:start">${ic('ai')}watsonx Orchestrate · MCP</span>
      <span class="xs muted">הסוכן לא ממציא מספרים: כל סכום בתשובה מגיע מקריאת כלי שמופיעה ב"קריאות כלים". אם אין נתון, הוא אומר שאין.</span>
    </div>`;

  fillIcons(document);
})();
</script>
</body>
</html>
