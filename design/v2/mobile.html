<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מובייל · איפה הכסף</title>
<link rel="stylesheet" href="assets/ds.css">
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #0F1A24, var(--bg)); min-height: 100vh; }
  .strip { width: min(1520px, 100% - 32px); margin: 24px auto 0; border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 380px; background: linear-gradient(120deg, var(--surface-2), var(--bg-2)); min-height: 280px; }
  .strip .txt { padding: 40px 44px; display: grid; gap: 14px; align-content: center; }
  .strip .art { position: relative; background: radial-gradient(circle at 40% 40%, var(--brand-glow), transparent 60%), linear-gradient(135deg, var(--surface-3), var(--bg-2)); }
  .strip .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
  .strip .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, rgba(11,17,24,.9)); }
  .strip .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .canvas { display: flex; flex-wrap: wrap; justify-content: center; gap: 56px 44px; padding: 48px 24px 80px; }
  figure { margin: 0; display: grid; gap: 16px; justify-items: center; }
  figcaption { text-align: center; display: grid; gap: 2px; }
  figcaption b { font-size: 1rem; } figcaption span { font-size: .82rem; color: var(--muted); }
  @media (max-width: 760px) {
    .strip { grid-template-columns: 1fr; } .strip .art { height: 220px; order: -1; } .strip .art::after { background: linear-gradient(180deg, transparent 50%, rgba(11,17,24,.95)); }
    .strip .txt { padding: 22px 20px 26px; }
    .canvas { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; padding: 28px 16px 64px; gap: 20px; }
    figure { scroll-snap-align: center; }
    .phone { transform-origin: top center; }
  }

  /* ---------- in-phone UI ---------- */
  .screen { font-size: 15px; }
  .screen .status { position: relative; z-index: 4; }
  .status .ic { display: flex; gap: 6px; align-items: center; }
  .status svg { width: 17px; height: 12px; }
  .scr { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .pad { padding: 0 18px; }
  .m-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 18px 12px; }
  .m-title { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; margin: 0; }
  .m-sub { font-size: .8rem; color: var(--muted); }
  .m-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #FFB547, #FF7A6B); color: #1A0D02; font-weight: 800; font-size: .82rem; }
  .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); flex: none; }
  .ib svg, .tb svg, .m-btn svg { width: 20px; height: 20px; }
  .home-ind { height: 34px; flex: none; display: grid; place-items: center; }
  .home-ind::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: rgba(234,240,246,.85); }
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: rgba(11,17,24,.92); backdrop-filter: blur(14px); padding-top: 6px; }
  .tb { display: grid; justify-items: center; gap: 2px; min-height: 49px; font-size: .66rem; color: var(--muted); position: relative; }
  .tb.on { color: var(--brand); }
  .tb .bdg { position: absolute; top: -2px; right: calc(50% - 24px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--amber); color: #1A1003; font-size: .64rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
  .m-card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .m-btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface-3); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; cursor: pointer; }
  .m-btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
  .m-sec { font-size: .74rem; font-weight: 700; color: var(--faint); letter-spacing: .06em; padding: 14px 18px 8px; display: flex; justify-content: space-between; }
  .fid { font-family: var(--mono); font-size: .72rem; color: var(--amber); direction: ltr; unicode-bidi: isolate; }

  /* a: home */
  .hero-n { padding: 6px 18px 4px; position: relative; }
  .hero-n::before { content: ""; position: absolute; inset: -30px 10% auto; height: 140px; background: radial-gradient(closest-side, var(--brand-glow), transparent); pointer-events: none; }
  .hero-n .big-money { font-size: 3rem; position: relative; }
  .bk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 18px 0; }
  .bk div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 2px; }
  .bk b { font-size: .98rem; } .bk span { font-size: .68rem; color: var(--muted); line-height: 1.3; }
  .fl { display: grid; gap: 8px; padding: 0 18px; }
  .fl .m-card { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 12px; min-height: 64px; }
  .fl .cat { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .fl .cat svg { width: 18px; height: 18px; }
  .fl .t { font-weight: 600; font-size: .86rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* b: lock screen */
  .lock { background: radial-gradient(120% 70% at 80% 0%, rgba(46,230,168,.28), transparent 60%), radial-gradient(90% 60% at 0% 100%, rgba(91,157,255,.3), transparent 60%), linear-gradient(180deg, #0B1620, #05080C); }
  .lock .when { text-align: center; padding-top: 10px; }
  .lock .date { font-size: .95rem; font-weight: 600; color: var(--ink-2); }
  .lock .clock { font-size: 5.4rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; direction: ltr; }
  .notif { margin: 0 12px; border-radius: 22px; padding: 12px 14px; }
  .notif .hd { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--ink-2); }
  .notif .napp { width: 22px; height: 22px; border-radius: 6px; background: var(--bg); display: grid; place-items: center; }
  .notif .napp svg { width: 18px; height: 18px; }
  .notif .tt { font-weight: 800; font-size: .95rem; margin-top: 6px; }
  .notif .bd { font-size: .84rem; color: var(--ink-2); line-height: 1.45; }
  .n-actions { margin: 8px 12px 0; border-radius: 18px; overflow: hidden; display: grid; }
  .n-actions button { min-height: 48px; border: 0; background: rgba(27,38,51,.82); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,.06); text-align: start; padding: 0 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .n-actions button:last-child { border-bottom: 0; }
  .n-actions svg { width: 18px; height: 18px; color: var(--ink-2); }
  .lock-foot { margin-top: auto; display: flex; justify-content: space-between; padding: 0 44px 10px; }
  .lock-foot span { width: 50px; height: 50px; border-radius: 50%; background: rgba(16,23,31,.6); backdrop-filter: blur(10px); display: grid; place-items: center; }
  .lock-foot svg { width: 22px; height: 22px; }

  /* c: swipe stack */
  .stack-wrap { position: relative; flex: 1; margin: 6px 18px 0; }
  .sw { position: absolute; inset: 0 0 auto; height: 470px; border-radius: 24px; background: linear-gradient(180deg, var(--surface-3), var(--surface)); border: 1px solid var(--line-2); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); touch-action: pan-y; user-select: none; }
  .sw.b1 { transform: translateY(14px) scale(.95); opacity: .7; }
  .sw.b2 { transform: translateY(28px) scale(.9); opacity: .4; }
  .sw.top { cursor: grab; transition: transform .25s cubic-bezier(.2,.8,.2,1); z-index: 3; }
  .sw.top.drag { transition: none; }
  .ev { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: .8rem; }
  .ev div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .ev div:last-child { border-bottom: 0; }
  .stamp { position: absolute; top: 22px; padding: 4px 12px; border-radius: 10px; border: 2px solid; font-weight: 900; font-size: 1.1rem; opacity: 0; transform: rotate(-8deg); }
  .stamp.ok { inset-inline-start: 20px; color: var(--brand); } .stamp.no { inset-inline-end: 20px; color: var(--ok-gray); transform: rotate(8deg); }
  .sw-btns { display: flex; justify-content: center; gap: 22px; padding: 12px 0 10px; }
  .rb { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--surface-2); cursor: pointer; }
  .rb svg { width: 24px; height: 24px; }
  .rb.ok { background: var(--brand); color: var(--brand-ink); border-color: transparent; width: 68px; height: 68px; }
  .rb.no { color: var(--ink-2); } .rb.fw { color: var(--blue); }
  .rb-col { display: grid; justify-items: center; align-content: end; gap: 6px; font-size: .72rem; color: var(--muted); }
  .rb-l { display: flex; justify-content: center; gap: 30px; font-size: .7rem; color: var(--muted); margin-top: -6px; padding-bottom: 4px; }

  /* d: approvals + Face ID sheet */
  .ap { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 14px; }
  .ap .k { font-size: .7rem; font-weight: 700; color: var(--violet); display: flex; gap: 6px; align-items: center; }
  .ap .k svg { width: 13px; height: 13px; }
  .ap .t { font-weight: 700; font-size: .92rem; grid-column: 1 / -1; }
  .ap .d { font-size: .78rem; color: var(--muted); grid-column: 1 / -1; }
  .dim { position: absolute; inset: 0; background: rgba(3,6,9,.62); z-index: 6; }
  .sheet { position: absolute; inset: auto 0 0; z-index: 7; background: var(--surface-2); border-top: 1px solid var(--line-2); border-radius: 28px 28px 0 0; padding: 10px 20px 0; display: grid; gap: 12px; justify-items: center; text-align: center; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); }
  .faceid { width: 78px; height: 78px; color: var(--brand); position: relative; }
  .faceid svg { width: 100%; height: 100%; }
  @keyframes scan { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(54px); opacity: 1; } }
  .faceid::after { content: ""; position: absolute; inset: 10px 8px auto; height: 2px; background: var(--brand); box-shadow: 0 0 10px var(--brand); animation: scan 2.4s ease-in-out infinite; }
  .sheet .rows { width: 100%; border: 1px solid var(--line); border-radius: 14px; text-align: start; font-size: .82rem; }
  .sheet .rows div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .sheet .rows div:last-child { border-bottom: 0; }

  /* e: agent */
  .chat { flex: 1; overflow: hidden; padding: 4px 16px; display: grid; gap: 12px; align-content: start; }
  .u { justify-self: end; max-width: 82%; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: .9rem; font-weight: 500; }
  .a { display: grid; gap: 8px; font-size: .88rem; color: var(--ink-2); }
  .tr { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); border: 1px solid var(--line); background: var(--bg-2); border-radius: 10px; padding: 6px 10px; }
  .tr svg { width: 13px; height: 13px; }
  .mini { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .mini div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: .82rem; align-items: center; }
  .mini div:last-child { border-bottom: 0; background: var(--surface-2); font-weight: 800; color: var(--ink); }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; }
  .cite { font-family: var(--mono); font-size: .7rem; color: var(--amber); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 8px; direction: ltr; }
  .composer { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .composer .in { flex: 1; min-height: 48px; border-radius: 24px; border: 1px solid var(--line-2); background: var(--surface); display: flex; align-items: center; padding: 0 16px; color: var(--muted); font-size: .88rem; }
  .mic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #160B33; flex: none; position: relative; border: 0; }
  .mic svg { width: 24px; height: 24px; }
  .mic::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(167,139,250,.4); animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  .wave { display: flex; align-items: center; gap: 3px; height: 22px; }
  .wave i { width: 3px; border-radius: 2px; background: var(--violet); animation: wv 1s ease-in-out infinite; }
  @keyframes wv { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  .sg { display: flex; gap: 6px; overflow: hidden; padding: 6px 14px 0; background: var(--bg-2); }
  .sg span { flex: none; font-size: .74rem; border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; color: var(--ink-2); }

  /* f: receipt camera */
  .cam { background: radial-gradient(80% 60% at 50% 45%, #2a2721, #0b0a09 75%); position: relative; }
  .cam-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px; position: relative; z-index: 3; }
  .cam-top .ib { background: rgba(0,0,0,.4); border-color: rgba(255,255,255,.1); }
  .rcpt-zone { position: relative; flex: 1; display: grid; place-items: center; }
  .rcpt { width: 232px; background: #F4F1EA; color: #1d1d1b; border-radius: 3px; padding: 16px 16px 22px; font-size: 10.5px; line-height: 1.55; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(0,0,0,.6); position: relative; font-family: var(--mono); direction: rtl; }
  .rcpt .c { text-align: center; font-family: var(--font); }
  .rcpt .ln { display: flex; justify-content: space-between; gap: 6px; }
  .rcpt hr { border: 0; border-top: 1px dashed #9a958b; margin: 6px 0; }
  .rcpt::after { content: ""; position: absolute; inset: auto 0 -6px; height: 8px; background: radial-gradient(circle at 5px -1px, transparent 5px, #F4F1EA 5.5px) 0 0 / 10px 8px repeat-x; }
  .rcpt .hl { position: relative; outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 2px; margin-top: 15px; }
  .rcpt .hl.warn { outline: 2px dashed var(--amber); }
  .rcpt .hl .lbl { position: absolute; top: -4px; inset-inline-start: -4px; transform: translateY(-100%); margin: 0; font-size: 9.5px; line-height: 1.3; }
  .rcpt .hl.warn .lbl { background: var(--amber); color: #1A1003; }
  .hit { position: absolute; border: 2px solid var(--brand); border-radius: 4px; box-shadow: 0 0 0 9999px transparent; }
  .hit.warn { border-color: var(--amber); border-style: dashed; }
  .lbl { position: absolute; font-family: var(--font); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); white-space: nowrap; transform: translateY(-100%); margin-top: -3px; }
  .hit.warn .lbl { background: var(--amber); color: #1A1003; }
  .corners { position: absolute; inset: 14% 12%; pointer-events: none; }
  .corners i { position: absolute; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.85); }
  .corners i:nth-child(1) { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
  .corners i:nth-child(2) { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
  .corners i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
  .corners i:nth-child(4) { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }
  .det { position: relative; z-index: 3; margin: 0 10px; border-radius: 24px; padding: 14px; display: grid; gap: 10px; }
  .det .f { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: .82rem; }
  .det .f svg { width: 18px; height: 18px; }
  .warnbox { background: var(--amber-bg); border: 1px solid rgba(255,181,71,.35); border-radius: 12px; padding: 10px 12px; font-size: .78rem; color: var(--ink-2); line-height: 1.45; }
  .warnbox b { color: var(--amber); }
  .shutter { display: flex; justify-content: center; align-items: center; gap: 46px; padding: 10px 0 0; position: relative; z-index: 3; }
  .shutter .s { width: 66px; height: 66px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
  .shutter .s::after { content: ""; width: 52px; height: 52px; border-radius: 50%; background: #fff; }
  .shutter .th { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #F4F1EA, #c9c4b8); }
</style>
</head>
<body>
  <header class="strip">
    <div class="txt">
      <div class="brand" id="brand"></div>
      <h1 class="h-display" style="font-size:clamp(2.2rem,4.4vw,3.6rem)">איפה הכסף בכיס</h1>
      <p class="ink2" style="margin:0;max-width:56ch">האפליקציה למנהלי כספים בתנועה: מספר אחד בבוקר, התראה כשמשהו מתחדש ביוקר, אישור פעולות של הסוכן ב-Face ID, וצילום קבלה שבודק מספר הקצאה לפני שהמע״מ הולך לאיבוד.</p>
      <div class="legend"><span class="chip open"><span class="dot"></span>ממצא פתוח</span><span class="chip fixed"><span class="dot"></span>חיסכון</span><span class="chip progress"><span class="dot"></span>פעולה</span><span class="chip ai"><span class="dot"></span>AI</span><a class="chip" href="index.html">חזרה לכל המסכים</a></div>
    </div>
    <div class="art"><img src="img/mobile-hero.png" alt="" onerror="this.style.visibility='hidden'"></div>
  </header>

  <section class="canvas" id="canvas" aria-label="מסכי מובייל"></section>
  <div class="synthetic">נתונים סינתטיים · הדגמה</div>

<script src="assets/demo-data.js"></script>
<script>
(function () {
  const D = window.DEMO, K = D.kpi, F = (id) => D.findings.find(f => f.id === id);
  const P = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    find: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    chat: '<path d="M4 5h16v11H8l-4 4z"/>',
    ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
    bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',
    check: '<path d="M5 12l5 5L20 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
    fwd: '<path d="M10 6l-6 6 6 6M4 12h16"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    mic: '<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    ai: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/>',
    tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    flash: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    back: '<path d="M9 6l6 6-6 6"/>',
    cloud: '<path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',
    seat: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/>',
    doc: '<path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  };
  const ic = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;

  const CAT_IC = { ai: 'ai', cloud: 'cloud', saas: 'seat', ap: 'doc', telecom: 'chat', office: 'home', payroll: 'doc', finance: 'doc' };

  // (a) home
  const topOpen = D.findings.filter(f => f.status === 'open' && f.amount).sort((a, b) => b.amount - a.amount).slice(0, 4);
  const a = `<div class="scr">

      <div class="hero-n"><div class="m-sub">חיסכון חוזר שזוהה, לשנה</div><div class="big-money money">${ils(K.recurringSavings)}</div><div class="m-sub" style="margin-top:4px"><span class="num">${K.openFindings}</span> ממצאים פתוחים · ${D.company.name}</div></div>
      <div class="bk"><div><b class="money">${ilsK(K.oneTimeRecovery)}</b><span>החזר חד-פעמי</span></div><div><b class="money accent-text">${ilsK(K.verifiedSaved)}</b><span>נחסך ואומת</span></div><div><b class="money" style="color:var(--amber)">${ilsK(K.toReview)}</b><span>לבדיקה, לא חיסכון</span></div></div>

  // (b) lock screen push
  const hs = F('F-1009'), hv = D.vendors.find(v => v.name === 'HubSpot'), dup = F('F-1012');
  const b = `<div class="scr lock" style="margin-top:-52px;padding-top:52px">

      <div class="notif glass" style="margin-top:12px;opacity:.85"><div class="hd"><span class="napp">${LOGO}</span><span class="grow" style="font-weight:700">איפה הכסף</span><span>לפני שעה</span></div>
        <div class="tt" style="font-size:.88rem">חיוב כפול: MongoDB Atlas · ${m(dup.amount)}</div><div class="bd">שולם בכרטיס ובהעברה. לבקש זיכוי?</div></div>
      <div class="lock-foot"><span>${ic('flash')}</span><span>${ic('cam')}</span></div>
      <div class="home-ind"></div>
    </div>`;

  // (c) swipe card stack
  const sf = F('F-1012'), usd = 10450;
  const c = `<div class="scr">
      <div class="m-top"><span class="ib">${ic('back')}</span><div style="text-align:center"><div style="font-weight:800">סקירה מהירה</div><div class="m-sub"><span class="num">1</span> מתוך <span class="num">${pending}</span> פתוחים</div></div><span class="ib">${ic('more')}</span></div>
      <div class="stack-wrap" id="stack">
        <div class="sw b2"></div><div class="sw b1"></div>
        <article class="sw top" id="swTop" aria-label="ממצא ${sf.id}">
          <span class="stamp ok">אשר</span><span class="stamp no">דחה</span>
          <div class="row between"><span class="fid">${sf.id}</span><span class="chip open"><span class="dot"></span>החזר חד-פעמי</span></div>
          <div style="font-weight:800;font-size:1.12rem;line-height:1.3">${sf.title}</div>
          <div class="big-money money" style="font-size:2.4rem">${ils(sf.amount)}</div>
          <div class="m-sub" style="color:var(--ink-2)">אותה חשבונית INV-ATL-88213, שני אמצעי תשלום, הפרש 8 ימים.</div>
          <div class="ev"><div><span>כרטיס Cal · 03/08/2026</span><span class="money">$${usd.toLocaleString('en-US')}</span></div><div><span>העברה בנקאית · 11/08/2026</span>${m(sf.amount)}</div><div><span class="muted">שער ביום החיוב</span><span class="num">${D.company.usdIls.toFixed(2)}</span></div></div>
          <div class="row between small"><span class="muted">ביטחון</span><span class="conf">${[1,2,3,4,5].map(i => `<i class="${sf.conf >= i / 5 - .05 ? 'on' : ''}"></i>`).join('')}</span></div>
          <div class="small" style="margin-top:auto"><span class="muted">פעולה: </span>${sf.action}</div>
        </article>
      </div>
      <div class="sw-btns">${[['no', 'x', 'דחה'], ['ok', 'check', 'אשר'], ['fw', 'fwd', 'העבר ליעל']].map(([k, i, l]) => `<span class="rb-col"><button class="rb ${k}" aria-label="${l}" data-a="${k}">${ic(i)}</button><span>${l}</span></span>`).join('')}</div>
    </div><div class="home-ind"></div>`;

  // (d) approvals + Face ID
  const fg = F('F-1011'), zb = F('F-1003');
  const APS = [
    ['mail', 'מייל לספק', `מייל ל-HubSpot: בקשה למחיר הקודם`, `${hs.id} · פוטנציאל ${ils(hs.amount)} לשנה`],
    ['seat', 'שינוי רישיונות', `הורדת 13 מושבי Figma ל-Viewer`, `${fg.id} · ${ils(fg.amount)} לשנה · נועה (Ops) מאשרת`],
    ['trash', 'מחיקת משאב ענן', `מחיקת אשכול EKS "staging-old"`, `${zb.id} · ${ils(zb.amount)} לשנה · גיבוי נלקח`],
  ];
  const d = `<div class="scr" style="position:relative">
      <div class="m-top"><div><h2 class="m-title">אישורים</h2><div class="m-sub"><span class="num">3</span> פעולות שהסוכן הכין, ממתינות לך</div></div><span class="ib">${ic('bell')}</span></div>
      <div class="fl">${APS.map(([i, k, t, dd]) => `<div class="m-card ap" style="grid-template-columns:1fr auto"><span class="k">${ic('ai')}${k} · נוסח ע״י הסוכן</span><span class="chip progress">ממתין</span><span class="t">${t}</span><span class="d">${dd}</span></div>`).join('')}</div>
      <div class="dim"></div>
      <div class="sheet" role="dialog" aria-label="אישור מחיקה">
        <span class="grab"></span>
        <div style="font-weight:800;font-size:1.1rem">למחוק את staging-old?</div>
        <div class="m-sub" style="color:var(--ink-2);max-width:30ch">${zb.why}</div>
        <div class="rows"><div><span class="muted">חיסכון</span>${m(zb.amount)}<span class="muted">/שנה</span></div><div><span class="muted">גיבוי</span><span>01/11/2026 07:50 · שחזור עד 30 יום</span></div><div><span class="muted">יבוצע ע״י</span><span>MCP · <span class="mono">delete_resource</span></span></div></div>
        <div class="faceid">${'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 20V12a6 6 0 0 1 6-6h8M44 6h8a6 6 0 0 1 6 6v8M58 44v8a6 6 0 0 1-6 6h-8M20 58h-8a6 6 0 0 1-6-6v-8"/><path d="M22 24v4M42 24v4M32 24v12h-3M24 44c4 4 12 4 16 0"/></svg>'}</div>
        <div style="font-weight:700">אישור עם Face ID</div>
        <button class="m-btn" style="width:100%;background:transparent;border-color:transparent;color:var(--muted)">ביטול</button>
      </div>
    </div><div class="home-ind" style="position:relative;z-index:8;background:var(--surface-2)"></div>`;

  // (e) agent with voice
  const seatIds = ['F-1011', 'F-1015', 'F-1018'], seats = seatIds.map(F), seatSum = seats.reduce((s, f) => s + f.amount, 0);
  const e = `<div class="scr">
      <div class="m-top"><span class="ib">${ic('back')}</span><div style="text-align:center"><div style="font-weight:800">הסוכן</div><div class="m-sub" style="color:var(--violet)">watsonx Orchestrate · MCP</div></div><span class="ib">${ic('more')}</span></div>
      <div class="chat">
        <div class="u">כמה נחסוך אם נסגור את כל המושבים שלא בשימוש?</div>
        <div class="a">
          <div class="tr">${ic('tool')}<span class="mono">list_findings</span><span>· 3 שורות · 38ms</span></div>
          <div>שלושה ממצאי רישיונות פתוחים, יחד <b style="color:var(--brand)">${m(seatSum)}</b> לשנה:</div>
          <div class="mini">${seats.map(f => `<div><span>${f.vendor} <span class="fid">${f.id}</span></span>${m(f.amount)}</div>`).join('')}<div><span>סה״כ</span>${m(seatSum)}</div></div>
          <div>הכי פשוט: Figma, כי ההורדה ל-Viewer נכנסת בחידוש בלי לבטל לאף אחד גישה.</div>
          <div class="cites">${seatIds.map(i => `<a class="cite" href="app-finding.html?id=${i}">[${i}]</a>`).join('')}<span class="cite" style="color:var(--ink-2)">saas_seats.csv · 13</span></div>
        </div>
        <div class="u" style="display:flex;align-items:center;gap:10px;background:var(--violet-bg);border-color:rgba(167,139,250,.35)"><span class="wave" aria-hidden="true">${[10, 18, 8, 20, 14, 6, 16, 12, 20, 9].map((h, i) => `<i style="height:${h}px;animation-delay:${i * .08}s"></i>`).join('')}</span><span style="color:var(--violet)">מקשיב…</span></div>
      </div>
      <div class="sg"><span>תכין משימה בג׳ירה</span><span>מי הבעלים?</span><span>מה מתחדש החודש?</span></div>
      <div class="composer"><span class="in">שאלו או החזיקו לדבר…</span><button class="mic" aria-label="קלט קולי">${ic('mic')}</button></div>
    </div><div class="home-ind" style="background:var(--bg-2)"></div>`;

  // (f) receipt camera — invoice of קוד-פלוס from F-1026 (18,500 ₪ before VAT)
  const net = 18500, vat = Math.round(net * .18), alloc = 5000;
  const f = `<div class="scr cam" style="margin-top:-52px;padding-top:52px">
      <div class="cam-top"><span class="ib">${ic('x')}</span><span class="chip" style="background:rgba(0,0,0,.45)">צילום קבלה</span><span class="ib">${ic('flash')}</span></div>
      <div class="rcpt-zone">
        <div class="corners"><i></i><i></i><i></i><i></i></div>
        <div class="rcpt" id="rcpt">
          <div class="c hl" style="font-weight:800;font-size:13px;margin-top:4px"><span class="lbl">ספק</span>קוד-פלוס ייעוץ בע״מ</div>
          <div class="c">ע.מ. 514477812 · רמת גן</div><hr>
          <div class="ln"><span>חשבונית מס</span><span>4471</span></div>
          <div class="ln"><span>תאריך</span><span>14/10/2026</span></div>
          <div class="ln"><span>לקוח</span><span>טכנוסיס בע״מ</span></div><hr>
          <div class="ln"><span>ייעוץ פיתוח · אוקטובר</span><span>${net.toLocaleString('en-US')}.00</span></div><hr>
          <div class="ln"><span>סה״כ לפני מע״מ</span><span>${net.toLocaleString('en-US')}.00</span></div>
          <div class="ln hl"><span class="lbl">מע״מ</span><span>מע״מ 18%</span><span>${vat.toLocaleString('en-US')}.00</span></div>
          <div class="ln hl" style="font-weight:700"><span class="lbl">סכום</span><span>לתשלום</span><span>${(net + vat).toLocaleString('en-US')}.00</span></div>
          <div class="ln hl warn" style="color:#8a857b"><span class="lbl">מספר הקצאה חסר</span><span>מספר הקצאה</span><span>________</span></div>
        </div>
      </div>
      <div class="det glass">
        <div class="f" style="color:var(--brand)">${ic('check')}<span style="color:var(--ink)">קוד-פלוס ייעוץ · חשבונית 4471</span><span class="xs muted">ספק</span></div>
        <div class="f" style="color:var(--brand)">${ic('check')}<span style="color:var(--ink)">${m(net + vat)} · מע״מ ${m(vat)}</span><span class="xs muted">סכום</span></div>
        <div class="warnbox"><b>חסר מספר הקצאה.</b> חשבונית מעל ${m(alloc)} לפני מע״מ, אז מע״מ של ${m(vat)} לא ניתן לקיזוז. נמצאו עוד 3 חשבוניות דומות מאותו ספק.</div>
        <button class="m-btn primary" style="width:100%">בקשו חשבונית מתוקנת מהספק</button>
      </div>
      <div class="shutter"><span class="th"></span><span class="s" aria-label="צילום"></span><span class="ib" style="background:rgba(0,0,0,.4)">${ic('cam')}</span></div>
      <div class="home-ind"></div>
    </div>`;

  document.getElementById('canvas').innerHTML = [
    phone('בית', 'מספר אחד, שלושה דליים, הממצאים הכי שווים', a + ''),
    phone('התראת Push', 'חידוש יקר, עם פעולות ישר מהמסך הנעול', b),
    phone('ממצא · החלקה', 'אשר, דחה או העבר. ראיה על הכרטיס', c),
    phone('אישורים', 'פעולות שהסוכן הכין, אישור ב-Face ID', d),
    phone('סוכן', 'שיחה עם ציטוטים, קלט קולי', e),
    phone('צילום קבלה', 'זיהוי שדות ובדיקת מספר הקצאה', f),
  ].join('');

  // swipe interaction (pointer), buttons do the same; reduced motion = no fly-out animation
  const top = document.getElementById('swTop'), ok = top.querySelector('.stamp.ok'), no = top.querySelector('.stamp.no');
  let x0 = null, dx = 0;
  const set = (x) => { top.style.transform = `translateX(${x}px) rotate(${x / 18}deg)`; ok.style.opacity = Math.max(0, -x / 90); no.style.opacity = Math.max(0, x / 90); };
  const fling = (dir) => { set(dir * 420); setTimeout(() => { top.style.transition = 'none'; set(0); requestAnimationFrame(() => { top.style.transition = ''; }); }, 450); };
  top.addEventListener('pointerdown', ev => { x0 = ev.clientX; top.classList.add('drag'); top.setPointerCapture(ev.pointerId); });
  top.addEventListener('pointermove', ev => { if (x0 === null) return; dx = ev.clientX - x0; set(dx); });
  top.addEventListener('pointerup', () => { top.classList.remove('drag'); if (Math.abs(dx) > 110) fling(Math.sign(dx)); else set(0); x0 = null; dx = 0; });
  document.querySelector('.sw-btns').addEventListener('click', ev => { const btn = ev.target.closest('button'); if (!btn) return; const a = btn.dataset.a; if (a === 'fw') { top.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-16px)' }, { transform: 'translateY(0)' }], 300); return; } fling(a === 'ok' ? -1 : 1); });
})();
</script>
