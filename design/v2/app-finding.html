    'F-1005': {
      calc: [['צריכה חודשית של המפתח dan-experiments', M(usd(1840))], ['× שער 3.70', M('₪6,808')], ['× 12 חודשים', M('₪81,696')], ['מעוגל', M(ils(81600) + ' / שנה'), 1]],
      ev: [['OpenAI Usage API', '31/10/2026', 'key: dan-experiments · 1,212 requests · gpt-5', '$61', 'שימוש יומי'], ['OpenAI Usage API', '10/2026', 'key: dan-experiments · סה״כ חודש', usd(1840), 'שימוש'], ['HiBob', '15/07/2026', 'EMP-1052 · R&D · סטטוס: עזב', '—', 'סיום העסקה']], hl: [1],
    },
    'F-1024': { calc: [['קווים לא פעילים', M('9')], ['× ₪89 לקו לחודש', M('₪801')], ['× 12 חודשים', M('₪9,612')], ['מעוגל', M(ils(9600) + ' / שנה'), 1]] },
    'F-1026': { calc: [['חשבונית בודדת', M(ils(18500))], ['סף אישור סמנכ״ל', M(ils(20000))], ['4 חשבוניות × 18,500 תוך 25 יום', M(ils(74000))], ['סכום בבדיקה (לא נספר כחיסכון)', M(ils(74000)), 1]] },
    'F-1020': { calc: [['סכום לפני מע״מ ב-6 החשבוניות', M(ils(110000))], ['× 18% מע״מ', M(ils(19800))], ['מע״מ שלא ניתן לקזז בלי מספר הקצאה', M(ils(19800)), 1]] },
  };
  const sp = SPEC[f.id] || {};

  document.title = f.id + ' · ' + f.title + ' · איפה הכסף';
  $('#crumbId').textContent = f.id;
  const K = KIND[f.kind];
  const pct = Math.round(f.conf * 100);
  const confWhy = f.conf >= .95 ? 'כמעט ודאי: כל השדות המזהים תואמים בין המקורות' : f.conf >= .85 ? 'גבוה: הדפוס ברור, נשאר אימות קצר מול בעל התקציב' : f.conf >= .72 ? 'בינוני-גבוה: הנתונים תומכים, ייתכן הקשר עסקי שלא רואים בנתונים' : 'בינוני: חשד לבדיקה, ייתכן הסבר תקין';

  // header
  const steps = f.status === 'reviewed_ok' ? [['נמצא', 'done'], ['בטיפול', 'done'], ['נבדק תקין', 'okd']] :
    [['נמצא', 'done'], ['בטיפול', f.status === 'in_progress' ? 'cur' : f.status === 'fixed' ? 'done' : ''], [f.kind === 'recovery' ? 'הוחזר' : 'נחסך', f.status === 'fixed' ? 'done' : '']];
  if (f.status === 'open') steps[0][1] = 'cur';
  $('#head').innerHTML = `
    <div class="row wrap" style="gap:8px; position:relative"><span class="mono muted">${f.id}</span><span class="chip"><i class="dot" style="color:var(--cat-${f.cat})"></i>${D.categories[f.cat]}</span><span class="chip ${STATUS[f.status][0]}">${STATUS[f.status][1]}</span><span class="chip">${K[0]}</span></div>
    <h1 class="h1" style="margin-top:12px; position:relative">${f.title}</h1>
    <div class="row wrap" style="margin-top:18px; align-items:flex-end; gap:12px; position:relative">
      <span class="amount ${K[2]} money">${f.amount ? ils(f.amount) : '—'}</span><span class="ink2" style="font-weight:600; padding-bottom:6px">${K[1]}</span>
    </div>
    <div class="kv">
      <div><div class="k">ספק</div><div class="v">${f.vendor}</div></div>
      <div><div class="k">בעלים</div><div class="v">${f.owner}</div></div>
      <div><div class="k">נמצא</div><div class="v num">${fmtD(found)}</div></div>
      <div title="${confWhy}"><div class="k">ביטחון <b class="num" style="color:var(--ink)">${pct}%</b></div><div class="confbar"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="xs muted" style="margin-top:8px">ביטחון ${pct}%: ${confWhy}.</div>
    <div class="stepper" aria-label="סטטוס">${steps.map(([l, c], i) => `${i ? `<span class="bar-sep ${c === 'done' || c === 'okd' || (c === 'cur' && i) ? 'done' : ''}"></span>` : ''}<span class="step ${c}"><span class="b">${c === 'done' || c === 'okd' ? '✓' : i + 1}</span>${l}</span>`).join('')}
      ${f.status === 'open' || f.status === 'in_progress' ? `<span class="xs muted" style="margin-inline-start:14px">או: נבדק תקין</span>` : ''}</div>`;

  // why
  $('#rule').innerHTML = `<div class="row wrap" style="gap:8px"><b>${RULES[f.rule] || f.rule}</b><span class="mono muted xs">${f.rule}</span></div><div class="ink2" style="margin-top:6px">${f.why}</div>`;
  const calc = sp.calc || (f.kind === 'recurring' ? [['עלות עודפת לחודש (ממוצע 3 חודשים)', M(ils(f.amount / 12))], ['× 12 חודשים', M(ils(f.amount))], ['חיסכון שנתי צפוי אחרי הפעולה', M(ils(f.amount) + ' / שנה'), 1]]
    : f.kind === 'recovery' ? [['סכום שחויב או שולם ביתר', M(ils(f.amount))], ['זיכוי או החזר לבקש', M(ils(f.amount)), 1]]
    : f.kind === 'review' ? [['סכום שעובר דרך החריגה', M(ils(f.amount))], ['לבדיקה אנושית, לא נספר כחיסכון', M(ils(f.amount)), 1]]
    : [['אין סכום כספי עד בדיקת זכאות', '—', 1]]);
  $('#calc').innerHTML = calc.map(([l, r, res], i) => `<div class="ln ${res ? 'res' : ''}"><span class="i">${res ? '=' : String(i + 1).padStart(2, '0')}</span><span class="${res ? '' : 'ink2'}">${l}</span><span class="r">${r}</span></div>`).join('');

  // evidence
  const evRows = sp.ev || f.why.split(/\.\s+/).filter(Boolean).map((s, i) => [i === 0 ? CAT_SRC[f.cat] : (f.cat === 'payroll' || /HiBob|עזב/.test(s) ? 'HiBob' : CAT_SRC[f.cat]), fmtD(plus(found, -3 - i * 6)), s.replace(/\.$/, ''), i === 0 && f.amount ? ils(f.amount) : '—', i === 0 ? 'מדד' : 'הקשר']);
  const hl = sp.hl || [0];
  $('#evCount').textContent = `${evRows.length} שורות מקור · ${new Set(evRows.map(r => r[0])).size} מערכות`;
  $('#ev').innerHTML = `<thead><tr><th>מקור</th><th>תאריך</th><th>שורה</th><th>סוג</th><th class="end">סכום</th></tr></thead><tbody>` +
    evRows.map((r, i) => `<tr class="${hl.includes(i) ? 'hl' : ''}"><td>${src(r[0])}</td><td><span class="num">${r[1]}</span></td><td>${r[2]}</td><td class="muted">${r[4]}</td><td class="end"><span class="money" style="font-weight:700">${r[3]}</span></td></tr>`).join('') + '</tbody>';
  if (!(sp.rcpt || f.cat === 'ap' || f.kind === 'recovery')) document.querySelector('.ev-grid').classList.add('norcpt');
  const slug = sp.rcpt || f.vendor.toLowerCase().replace(/[^a-z0-9]+/g, '');
  const invNo = f.id === 'F-1012' ? 'INV-ATL-88213' : 'INV-' + f.id.slice(2) + '-' + (found.getMonth() + 1);
  const paperAmt = f.id === 'F-1012' ? usd(10450) : f.amount ? ils(f.amount) : '—';
  $('#receipt').innerHTML = `<div class="paper" aria-hidden="true"><b>${/[a-z]/i.test(f.vendor) ? f.vendor : 'Vendor'}</b><br>Tax invoice / Receipt<br>${invNo}<br>Date: ${f.id === 'F-1012' ? '05/08/2026' : fmtD(plus(found, -10))}<hr>Bill to: Technosis Ltd<br>VAT ID 515873214<hr>${f.id === 'F-1012' ? 'Atlas Dedicated M40<br>Jul 2026 usage<br>Data transfer' : 'Services · period<br>As per agreement'}<hr><div class="tot"><span>TOTAL</span><span>${paperAmt}</span></div>${f.kind === 'recovery' ? '<div class="stamp">PAID ×2</div>' : ''}</div>
    ${sp.rcpt ? `<img src="../../data/startup/receipts/receipt_${slug}.png" alt="סריקת חשבונית ${f.vendor}" onerror="this.remove()">` : ''}`;
  $('#rcptCap').innerHTML = `${src('Gmail')} נקלט מתיבת החשבוניות · <span class="mono">${invNo}</span>`;

  // action
  $('#actionText').textContent = f.action;
  const primaryLbl = { recovery: 'שלח בקשת זיכוי לספק', recurring: 'שלח לבעלים לביצוע', review: 'העבר לבדיקה', opportunity: 'בדוק זכאות' }[f.kind];
  $('#primary').textContent = primaryLbl;
  $('#to').textContent = sp.to || (f.kind === 'recovery' ? `${f.vendor}, הנהלת חשבונות` : f.owner);
  const genMail = {
    he: f.kind === 'recovery' ? `שלום,\n\nבבדיקת התשלומים שלנו מצאנו: ${f.title}.\n${f.why}\n\nנבקש זיכוי או קיזוז בסך ${ils(f.amount)} בחשבונית הבאה. מצורפות שורות המקור.\n\nתודה,\n${f.owner.split(' ')[0]}\nטכנוסיס בע״מ`
      : `היי ${f.owner.split(' ')[0]},\n\nממצא ${f.id}: ${f.title}.\n${f.why}\n\nהפעולה המוצעת: ${f.action}.\nהשפעה: ${f.amount ? ils(f.amount) + ' ' + K[1] : 'לבדיקה'}. הראיות מקושרות בממצא.\n\nתודה,\nמיכל`,
    en: f.kind === 'recovery' ? `Hello,\n\nDuring our payment review we found a duplicate / excess charge (${f.id}).\nWe'd appreciate a refund or a credit of ILS ${f.amount.toLocaleString('en-US')} against our next invoice. Source records are attached.\n\nThanks,\nFinance, Technosis Ltd`
      : `Hi,\n\nFinding ${f.id} (${f.rule}) is assigned to you.\nEstimated impact: ILS ${f.amount.toLocaleString('en-US')}${f.kind === 'recurring' ? ' per year' : ''}.\nThe evidence rows and suggested action are linked in the finding.\n\nThanks,\nMichal`,
  };
  const mail = sp.email || genMail;
  const setLang = (l) => { $('#mail').value = mail[l]; $('#mail').dir = l === 'en' ? 'ltr' : 'rtl'; document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l)); };
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  setLang('he');
  $('#copy').onclick = () => { navigator.clipboard?.writeText($('#mail').value).catch(() => {}); toast('הטיוטה הועתקה'); };
  $('#primary').onclick = () => { addEv('נשלח ' + (f.kind === 'recovery' ? 'מייל לספק' : 'לבעלים'), 'var(--blue)'); toast(f.kind === 'recovery' ? 'המייל נשלח מתיבת finance@ והממצא עבר ל"בטיפול"' : `נשלח ל-${f.owner}`); };
  const jiraKey = 'FIN-' + (400 + +f.id.slice(2) % 100);
  $('#jira').textContent = 'צור משימה ב-Jira';
  $('#jira').onclick = () => { addEv(`נפתחה משימה ${jiraKey} ב-Jira`, 'var(--blue)'); toast(`נפתחה ${jiraKey} עם הראיות`); };
  $('#slack').onclick = () => { addEv(`נשלח ל-${f.owner} ב-Slack`, 'var(--violet)'); toast(`נשלח ל-${f.owner} ב-Slack`); };
  $('#okBtn').onclick = () => { addEv('סומן "נבדק תקין" ע״י מיכל לוי, עם נימוק', 'var(--ok-gray)'); toast('סומן נבדק תקין. הכלל ילמד מזה בסריקה הבאה'); };

  // timeline
  const tl = [[fmtD(found) + ' 06:12', `נמצא בסריקה אוטומטית · כלל <span class="mono">${f.rule}</span>`, 'var(--amber)'],
    [fmtD(found) + ' 06:12', `שויך אוטומטית ל-${f.owner} לפי בעלות על ${f.vendor}`, 'var(--line-2)'],
    [fmtD(plus(found, 1)) + ' 08:00', 'נכלל בסיכום השבועי ב-Slack #finance', 'var(--violet)']];
  if (f.status !== 'open') tl.push([fmtD(plus(found, 3)) + ' 11:40', `${f.owner.split(' ')[0]} סימן/ה "בטיפול"`, 'var(--blue)']);
  if (f.status === 'fixed') tl.push([fmtD(plus(found, 19)) + ' 09:05', `אומת: החיוב ירד בחשבונית הבאה · ${ils(f.amount)} לשנה נכנס ל"נחסך ואומת"`, 'var(--brand)']);
  if (f.status === 'reviewed_ok') tl.push([fmtD(plus(found, 6)) + ' 14:22', 'סומן "נבדק תקין": חבילה ייעודית לנסיעות שכבר נרכשה', 'var(--ok-gray)']);
  const drawTl = () => $('#tl').innerHTML = [...tl].reverse().map(([d, t, c]) => `<div class="ev" style="--c:${c}"><div>${t}</div><div class="xs muted num">${d}</div></div>`).join('');
  const addEv = (t, c) => { tl.push(['01/11/2026 ' + new Date().toTimeString().slice(0, 5), t + ' · מיכל לוי', c]); drawTl(); };
  drawTl();

  // agent mini chat
  const QA = [
    ['איך בדיוק חישבת את הסכום?', `לקחתי את ${calc.length - 1} שורות החישוב שמופיעות בסעיף "למה זה סומן". ${calc.at(-1)[0]}: ${calc.at(-1)[1]}. כל מספר מקושר לשורת מקור בסעיף הראיות.`],
    ['האם ייתכן שזה תקין?', f.conf >= .9 ? `לא סביר. ${confWhy}. מה שעלול להסביר: הסכם מיוחד עם ${f.vendor} שלא נמצא במערכות. אם יש כזה, סמני "נבדק תקין" והכלל ילמד.` : `ייתכן. ${confWhy}. כדאי לשאול את ${f.owner} לפני פעולה. זו חשד לבדיקה, לא קביעה.`],
    ['יש עוד מקרים דומים?', (() => { const sim = D.findings.filter(x => x.id !== f.id && (x.cat === f.cat || x.vendor === f.vendor)).slice(0, 3); return sim.length ? `כן, ${sim.length} ממצאים באותה קטגוריה: ${sim.map(x => `<a href="app-finding.html?id=${x.id}" style="color:var(--violet)">${x.id}</a> (${ils(x.amount)})`).join(', ')}.` : 'לא נמצאו מקרים דומים ב-24 החודשים האחרונים.'; })()],
  ];
  const chat = $('#chat');
  chat.innerHTML = `<div class="bubble bot">יש לי את כל ${evRows.length} שורות המקור של ${f.id}. מה לבדוק?</div>`;
  const ask = (q, a) => { chat.insertAdjacentHTML('beforeend', `<div class="bubble me">${q}</div><div class="bubble bot">${a}</div>`); };
  $('#sugg').innerHTML = QA.map(([q], i) => `<button data-q="${i}">${q}</button>`).join('');
  $('#sugg').onclick = (e) => { const b = e.target.closest('[data-q]'); if (!b) return; ask(...QA[b.dataset.q]); b.remove(); };
  $('#askForm').onsubmit = (e) => { e.preventDefault(); const q = $('#askIn').value.trim(); if (!q) return; ask(q.replace(/</g, '&lt;'), 'בהדגמה הסוכן עונה רק על השאלות המוצעות. בגרסה המלאה הוא עונה מתוך שורות המקור של הממצא דרך MCP.'); $('#askIn').value = ''; };

  // related
  const rel = D.findings.filter(x => x.id !== f.id && x.cat === f.cat).sort((a, b) => b.amount - a.amount).slice(0, 4);
  $('#related').innerHTML = `<div class="h3">עוד ב${D.categories[f.cat]}</div>` + (rel.length ? rel.map(x => `<a class="row between" style="min-height:36px" href="app-finding.html?id=${x.id}"><span class="ink2" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0">${x.title}</span><span class="money" style="font-weight:700">${ilsK(x.amount)}</span></a>`).join('') : '<div class="muted">אין ממצאים נוספים</div>');
})();
</script>
</body>
</html>
