# Static design site: design/v2 (+ receipts, spec, dashboard). TLS ends at the host nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    types { text/markdown md; }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / { return 302 /design/v2/; }
    location = /health { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
