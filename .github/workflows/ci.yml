name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gate · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    name: Gate · policy (keys, wording)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_policy.py

  lint:
    name: Gate · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # syntax errors and undefined names only; style is not a gate
      - run: ruff check --select E9,F63,F7,F82 .

  test:
    name: Gate · rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pandas pytest
      - run: python -m pytest -q engine/tests

  data:
    name: Gate · synthetic data (26 plants, 0 noise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pandas
      - name: Regenerate and confirm deterministic
        run: |
          python scripts/generate_startup_data.py --no-png
          git diff --stat --exit-code -- data/startup
      - run: python scripts/check_startup_data.py

  design:
    name: Gate · design smoke (no JS errors, no overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/check_design.py
